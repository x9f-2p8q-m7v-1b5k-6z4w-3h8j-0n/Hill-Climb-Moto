function draw(){
 ctx.setTransform(dpr,0,0,dpr,0,0);sky();
 const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;

 deco(x0,x1);
 let y0=h(Math.floor(x0/20)*20);
 for(let x=Math.floor(x0/20)*20;x<x1;x+=20){
  const y1=h(x+20);
  ctx.fillStyle=cd;ctx.beginPath();ctx.moveTo(x,y0);ctx.lineTo(x+21,y1);ctx.lineTo(x+21,bot);ctx.lineTo(x,bot);ctx.fill();
  ctx.fillStyle=ce;ctx.beginPath();ctx.moveTo(x,y0+70);ctx.lineTo(x+21,y1+70);ctx.lineTo(x+21,bot);ctx.lineTo(x,bot);ctx.fill();
  ctx.strokeStyle=cgr;ctx.lineWidth=16;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y0+2);ctx.lineTo(x+20,y1+2);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,y0-3);ctx.lineTo(x+20,y1-3);ctx.stroke();
  y0=y1;
 }
 const t=performance.now()/1000;
 for(let i=Math.floor(x0/140);i<=x1/140;i++){if(got.has(i))continue;const p=pk(i);if(!p)continue;
  if(p.t==='c'){const k=Math.abs(Math.cos(t*4+i));ctx.fillStyle=(M.veg?VC:CC)[p.tr];ctx.beginPath();ctx.ellipse(p.x,p.y,5+9*k,14+p.tr,0,0,7);ctx.fill();ctx.strokeStyle='#fff0a0';ctx.lineWidth=2.5;ctx.stroke()}
  else if(M.veg){pg([[p.x-10,p.y-16],[p.x+10,p.y-16],[p.x,p.y+22]],'#ff8c1a');ln(p.x,p.y-16,p.x-6,p.y-30,'#4caf50',4);ln(p.x,p.y-16,p.x+6,p.y-30,'#4caf50',4)}else{ctx.fillStyle='#e03131';ctx.fillRect(p.x-14,p.y-18,28,36);ctx.fillStyle='#fff';ctx.fillRect(p.x-14,p.y-6,28,10);ctx.fillStyle='#333';ctx.fillRect(p.x-6,p.y-24,12,7)}}

}
function loop(now){
